services:
  dezhurka:
    build: .
    image: dezhurka:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DEZHURKA_CONFIG: /app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - dezhurka-data:/app/data

volumes:
  dezhurka-data:
