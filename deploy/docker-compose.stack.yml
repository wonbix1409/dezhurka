# Демо-стенд: «Дежурка» + Prometheus + Alertmanager + Grafana (+ Zabbix по профилю).
# Запускается через deploy/setup.sh, вручную:
#   docker compose -f deploy/docker-compose.stack.yml --env-file .env up -d --build
#   docker compose -f deploy/docker-compose.stack.yml --env-file .env --profile zabbix up -d --build
#
# Наружу открыты только «Дежурка» (8000), Grafana (3000) и веб Zabbix (8080) — у всех есть логин.
# Prometheus и Alertmanager слушают только localhost: смотреть их через SSH-туннель.

name: dezhurka-stack

services:
  dezhurka:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DEZHURKA_CONFIG: /app/config.yaml
    extra_hosts:
      # прокси до Telegram, запущенный на самой машине стенда (DEZHURKA_TELEGRAM_PROXY)
      - "host.docker.internal:host-gateway"
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - dezhurka-data:/app/data
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      # Ссылки «график» в алертах: Prometheus открыт только локально,
      # смотреть через туннель ssh -L 9090:127.0.0.1:9090 (подсказку печатает setup.sh)
      - --web.external-url=http://localhost:9090/
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

  # ---------- Zabbix (профиль zabbix) ----------

  zabbix-db:
    profiles: [zabbix]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      POSTGRES_DB: zabbix
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data

  zabbix-server:
    profiles: [zabbix]
    image: zabbix/zabbix-server-pgsql:ubuntu-7.0-latest
    restart: unless-stopped
    depends_on: [zabbix-db]
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      POSTGRES_DB: zabbix
      TZ: ${STACK_TZ:-Europe/Moscow}   # {EVENT.TIME} в сообщениях

  zabbix-web:
    profiles: [zabbix]
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.0-latest
    restart: unless-stopped
    depends_on: [zabbix-server]
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      POSTGRES_DB: zabbix
      PHP_TZ: ${STACK_TZ:-Europe/Moscow}
    ports:
      - "8080:8080"

  zabbix-agent:
    profiles: [zabbix]
    image: zabbix/zabbix-agent2:ubuntu-7.0-latest
    restart: unless-stopped
    environment:
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: zabbix-server

volumes:
  dezhurka-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  zabbix-db-data:
