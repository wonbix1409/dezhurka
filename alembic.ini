# Для разработки: новые миграции схемы ядра
#   DEZHURKA_DB_URL=sqlite+aiosqlite:///./data/dev.db alembic revision --autogenerate -m "что изменилось"
# В работе сервиса миграции применяются сами при старте (dezhurka.db.init_db).
[alembic]
script_location = dezhurka/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
